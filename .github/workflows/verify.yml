name: Sparse-V-Accelerator Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Simulation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb cocotb-test numpy matplotlib

      - name: Run Simulation
        run: |
          cd COCOTB/cocotb/Test
          # Önce eski derlemeyi temizle (MacBook kalıntılarını sil)
          make clean
          # Sıfırdan derle ve çalıştır
          make
        env:
          SIM: icarus
